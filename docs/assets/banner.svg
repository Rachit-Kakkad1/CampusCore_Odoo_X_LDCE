<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f" />
      <stop offset="35%" stop-color="#0b1120" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#190d2e" />
    </linearGradient>

    <!-- Deep Ambient Glows -->
    <radialGradient id="glowCyan" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowIndigo" cx="45%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="85%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPink" cx="95%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Gradient Fills for Text & Logos -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Patterns -->
    <pattern id="hexGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 48 14 L 48 34 L 24 48 L 0 34 L 0 14 Z" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.035" />
    </pattern>

    <pattern id="dotMatrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Fill & Patterns -->
  <rect width="1280" height="440" rx="20" fill="url(#bgGrad)" />
  <rect width="1280" height="440" rx="20" fill="url(#hexGrid)" />
  <rect width="1280" height="440" rx="20" fill="url(#dotMatrix)" opacity="0.7" />

  <!-- 2. Ambient Lighting Layers -->
  <rect width="1280" height="440" rx="20" fill="url(#glowCyan)" />
  <rect width="1280" height="440" rx="20" fill="url(#glowIndigo)" />
  <rect width="1280" height="440" rx="20" fill="url(#glowPurple)" />
  <rect width="1280" height="440" rx="20" fill="url(#glowPink)" />

  <!-- 3. Border Stroke -->
  <rect x="1.5" y="1.5" width="1277" height="437" rx="18.5" fill="none" stroke="url(#strokeGrad)" stroke-width="1.5" />

  <!-- 4. Top Micro Bar: Status Pill & Badges -->
  <g transform="translate(60, 42)">
    <!-- Odoo x LDCE Pill -->
    <rect width="210" height="28" rx="14" fill="#6366f1" fill-opacity="0.16" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="14" cy="14" r="4.5" fill="#38bdf8" />
    <text x="26" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#38bdf8">ODOO × LDCE 2026</text>

    <!-- Version / Status Pill -->
    <g transform="translate(225, 0)">
      <rect width="140" height="28" rx="14" fill="#10b981" fill-opacity="0.14" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="14" cy="14" r="4.5" fill="#34d399" />
      <text x="26" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#34d399">v2.4.0 PROD</text>
    </g>

    <!-- Architecture Pill -->
    <g transform="translate(380, 0)">
      <rect width="195" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" />
      <text x="14" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">LAYERED MVC + REPO</text>
    </g>
  </g>

  <!-- 5. Main Hero Brand Section -->
  <g transform="translate(60, 100)">
    <!-- Logo Emblem Graphic (Shield + Hex) -->
    <g transform="translate(0, 5)">
      <!-- Outer Pulsing Shield -->
      <polygon points="48,4 90,27 90,75 48,98 6,75 6,27" fill="url(#shieldGrad)" fill-opacity="0.18" stroke="url(#shieldGrad)" stroke-width="2.5" />
      <!-- Inner Precision Shield -->
      <polygon points="48,14 80,32 80,70 48,88 16,70 16,32" fill="#0b1120" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6" />
      <!-- Tech Core Diamond & Pulse -->
      <path d="M 34 42 L 48 28 L 62 42 L 48 56 Z" fill="url(#titleGrad)" />
      <circle cx="48" cy="58" r="16" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3" />
      <path d="M 40 70 L 48 78 L 56 70" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Main Title -->
    <g transform="translate(125, 0)">
      <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="-1.5" fill="url(#titleGrad)">CampusCore OS</text>
      
      <!-- Sub-headline -->
      <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#f1f5f9">
        The Autonomous Institutional Operating System for Student Governance &amp; Campus Organizations
      </text>

      <text x="0" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
        Engineered for high-concurrency event ticketing with zero overselling, cryptographic HMAC-SHA256 passes,
      </text>
      <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
        dual-stream crowdfunding aggregation, and double-entry treasury balance governance.
      </text>
    </g>
  </g>

  <!-- 6. Right Side Telemetry / Metrics HUD Card -->
  <g transform="translate(895, 95)">
    <!-- Main Card Body -->
    <rect width="325" height="195" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.12" />
    
    <!-- Header of HUD -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 309 0 C 317.84 0 325 7.16 325 16 L 325 40 L 0 40 Z" fill="#ffffff" fill-opacity="0.04" />
    <circle cx="24" cy="20" r="4.5" fill="#34d399" />
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#94a3b8">LIVE SYSTEM TELEMETRY</text>
    
    <!-- Stat 1: 17k Records -->
    <g transform="translate(24, 66)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">DATABASE RECORDS</text>
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#38bdf8">17,000+</text>
      <text x="96" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">verified rows</text>
    </g>

    <!-- Divider Line -->
    <line x1="24" y1="108" x2="301" y2="108" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />

    <!-- Stat 2 & 3: Two Columns -->
    <g transform="translate(24, 134)">
      <!-- Left: Test Invariants -->
      <g>
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#64748b">TEST SUITES</text>
        <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#34d399">100%</text>
        <text x="56" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">(323/323)</text>
      </g>
      <!-- Right: Concurrency -->
      <g transform="translate(145, 0)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#64748b">RACE DRIFT</text>
        <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#a855f7">0.00%</text>
        <text x="58" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">(FOR UPDATE)</text>
      </g>
    </g>

    <!-- Stat 4: Security Token Mode -->
    <g transform="translate(24, 182)">
      <rect x="-4" y="-12" width="280" height="20" rx="4" fill="#38bdf8" fill-opacity="0.08" />
      <text x="6" y="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#38bdf8">CIPHER: HMAC-SHA256 • RBAC 6 ROLES</text>
    </g>
  </g>

  <!-- 7. Bottom Engineering Feature Badges (6 Badges Dock) -->
  <g transform="translate(60, 320)">
    <!-- Pill 1: 17k Seed Dataset -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="19" fill="#1e293b" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="18" cy="19" r="5" fill="#38bdf8" />
      <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">17,000+ Seed Data</text>
    </g>

    <!-- Pill 2: Concurrency Shield -->
    <g transform="translate(195, 0)">
      <rect width="195" height="38" rx="19" fill="#1e293b" fill-opacity="0.7" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="18" cy="19" r="5" fill="#818cf8" />
      <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Zero-Race Seat Engine</text>
    </g>

    <!-- Pill 3: HMAC Pass -->
    <g transform="translate(405, 0)">
      <rect width="180" height="38" rx="19" fill="#1e293b" fill-opacity="0.7" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="18" cy="19" r="5" fill="#c084fc" />
      <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">HMAC-SHA256 Passes</text>
    </g>

    <!-- Pill 4: Dual-Stream Ledger -->
    <g transform="translate(600, 0)">
      <rect width="180" height="38" rx="19" fill="#1e293b" fill-opacity="0.7" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="18" cy="19" r="5" fill="#34d399" />
      <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Dual-Inflow Treasury</text>
    </g>

    <!-- Pill 5: Universal Pagination -->
    <g transform="translate(795, 0)">
      <rect width="185" height="38" rx="19" fill="#1e293b" fill-opacity="0.7" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="18" cy="19" r="5" fill="#fbbf24" />
      <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Indexed Pagination</text>
    </g>

    <!-- Pill 6: Full Audit Guard -->
    <g transform="translate(995, 0)">
      <rect width="165" height="38" rx="19" fill="#1e293b" fill-opacity="0.7" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="18" cy="19" r="5" fill="#ec4899" />
      <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Brute-Force Guard</text>
    </g>
  </g>

  <!-- 8. Footer Tech Ticker Badges -->
  <g transform="translate(60, 390)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569" letter-spacing="1.5">STACK:</text>
    <text x="65" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8">
      Node.js v20 • Express 4 • PostgreSQL 16 • React 18 • Vite 5 • TailwindCSS 3 • Jest 29 • Supertest • HTML5 QR Scanner
    </text>
  </g>
</svg>
